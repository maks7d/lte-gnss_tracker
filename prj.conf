# TF-M config
#CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General
CONFIG_FPU=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
#CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y


# GNSS sample
# One fix every GNSS_SAMPLE_PERIODIC_INTERVAL s, reported over LTE while GNSS sleeps
CONFIG_GNSS_SAMPLE_MODE_PERIODIC=y
# No screen clearing, so that application logs stay readable between NMEA sentences
CONFIG_GNSS_SAMPLE_NMEA_ONLY=y

# Position reporting
CONFIG_TRACKER_SERVER_ADDR=""
CONFIG_TRACKER_SERVER_PORT=4321

# LTE Link Control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
# PSM requested periodic TAU 8 hours
CONFIG_LTE_PSM_REQ_RPTAU="00101000"
# PSM requested active time 6 seconds
CONFIG_LTE_PSM_REQ_RAT="00000011"

# AT Host library - Used to send AT commands directy from an UART terminal and to allow
#		    integration with nRF Connect for Desktop LTE Link monitor application.
CONFIG_AT_HOST_LIBRARY=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y
# Disable native network stack to save some memory
CONFIG_NET_NATIVE=n

# Heap and main stack are sized by nrf-softsim/overlay-softsim.conf
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536

CONFIG_REBOOT=y
CONFIG_POSIX_API=y
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=n
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=n
CONFIG_SOFTSIM_FACTORY_RESET_ON_PROVISION=y
